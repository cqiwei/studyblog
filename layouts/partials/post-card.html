<li class="card">
  <a class="card-link" href="{{ .RelPermalink }}">
    <div class="card-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      <span class="dot">·</span>
      <span>{{ .ReadingTime }} 分钟</span>
    </div>
    <h3 class="card-title">{{ .Title }}</h3>
    {{ with .Description }}<p class="card-desc">{{ . }}</p>{{ end }}
    <div class="card-foot">
      {{ with .Params.tags }}
      <span class="tags">
        {{ range first 2 . }}<span class="tag">{{ . }}</span>{{ end }}
      </span>
      {{ end }}
      <span class="card-arrow">阅读 →</span>
    </div>
  </a>
</li>
