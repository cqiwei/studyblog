name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.170.1"
          extended: true

      - name: Build
        run: hugo --minify --gc --cleanDestinationDir

      - name: Package
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          tar -czf "/tmp/blog-$TS.tar.gz" -C public .
          echo "TS=$TS" >> "$GITHUB_ENV"

      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload
        run: |
          scp -P "${SSH_PORT:-22}" -i ~/.ssh/id_deploy \
            "/tmp/blog-$TS.tar.gz" "$SSH_USER@$SSH_HOST:/tmp/blog-$TS.tar.gz"

      - name: Activate
        run: |
          ssh -p "${SSH_PORT:-22}" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "bash -s -- $TS /tmp/blog-$TS.tar.gz" < deploy/scripts/remote-release.sh