# Debian/Ubuntu: /etc/nginx/sites-available/blog（软链到 sites-enabled）
# RHEL/CentOS:   /etc/nginx/conf.d/blog.conf
# bootstrap-server.sh 会把 __DOMAIN__ 替换成你的域名后安装这个文件。
# 之后 certbot --nginx 会自动往这个文件里写 ssl_certificate 相关配置并加上 80→443 跳转。

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/blog/current;
    index index.html;
    charset utf-8;

    # 静态站：找不到文件就 404，不要回落到 index.html（那是 SPA 的玩法）
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # 带指纹的静态资源可以放心长缓存
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # RSS 和 sitemap 短缓存
    location ~* \.(xml|txt)$ {
        expires 1h;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}