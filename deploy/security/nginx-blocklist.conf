# 扫描器与漏洞探测拦截
# 由 deploy/security/install-blocklist.sh 安装到 /etc/nginx/snippets/blog-blocklist.conf，
# 并在站点的 HTTPS server{} 里（尽量靠前）include 进来。
#
# 目的有两个：让日志只留下真实流量；万一构建产物里混进了 .git 之类的东西，
# 也不至于被人直接下载走。

# 反复扫 .env / .svn / phpmyadmin 的固定 IP（2026-11-22 观测）
deny 45.148.10.62;
deny 45.148.10.0/24;
deny 45.138.12.6;
deny 45.138.12.0/24;
deny 188.166.230.208;
deny 203.159.90.219;
deny 104.248.155.49;

# 版本库与密钥文件
location ~* /(\.git|\.svn|\.hg|\.bzr|\.env|\.DS_Store)(/|$) {
    access_log off;
    return 444;
}

# 任何动态脚本后缀：本站是纯静态，命中即探测
location ~* \.(php|phtml|php5|asp|aspx|jsp|cgi|pl|sh)$ {
    access_log off;
    return 444;
}

# 常见后台 / 配置文件探测
location ~* /(wp-admin|wp-login|wp-includes|wp-content|wp-json|xmlrpc\.php|administrator|phpmyadmin|myadmin|config\.json|\.ssh|\.aws|\.kube|actuator|solr|jenkins) {
    access_log off;
    return 444;
}

# 各类扫描器爱试的根文件
location ~* ^/(ads\.txt|app\.yml|sitemap\.xml\.gz|\.well-known/security\.txt)$ {
    access_log off;
    try_files $uri =404;
}