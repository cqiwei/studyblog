# 阅读数接口 + 访问统计面板
# 由 install-stats.sh 放到 /etc/nginx/snippets/blog-stats.conf，
# 并在 site 的 HTTPS server{} 里 include 进来。

# 计数服务只监听 127.0.0.1:8099，外部只能通过这里访问
location = /api/views {
    proxy_pass http://127.0.0.1:8099/api/views;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    access_log off;
    add_header Cache-Control "no-store" always;
}

location = /stats {
    return 301 /stats/;
}

# 只有你能看：Basic Auth + 不缓存
# 用前缀匹配（^~）而不是精确匹配，这样 /stats/index.html 内部跳转还能落回这里
location ^~ /stats/ {
    auth_basic "blog stats";
    auth_basic_user_file /etc/nginx/.htpasswd;
    alias /var/www/blog-stats/;
    index index.html;
    add_header Cache-Control "no-store" always;
}
